name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gemini_eval:
        description: Also run the eval against Gemini (needs the GEMINI_API_KEY secret, ~2 hours on the free tier)
        type: boolean
        default: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # A real Redis for the queue, retry, idempotency, cache and rate-limit tests.
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Playwright harness (sandbox portal)
        run: npm run test:harness

      - name: Failure-mode tests
        run: npm run test:failures

      - name: MCP server tests
        run: npm run test:mcp

      - name: S3 photo storage (mocked S3)
        run: npm run test:s3

      - name: Redis (BullMQ filing queue, retries, double-filing guard, cache, rate limit)
        env:
          REDIS_URL: redis://localhost:6379
        run: npm run test:redis

      - name: Tracing wiring (fake Langfuse endpoint)
        run: npm run test:tracing

      - name: Agent eval (offline planner, fails on regression)
        run: npm run eval:intake -- --offline --check

      - name: Help assistant (fixed answers, status answers, button names — every case must pass)
        run: npm run eval:help -- --offline

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-offline
          path: backend/eval/results/offline.json
          if-no-files-found: ignore

  docker:
    # Builds the production image (used by Render and AWS) and checks it starts as the non-root
    # user and answers /health, before anything reaches main.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nagrik backend
      - name: Run and check /health
        run: |
          docker run -d --name nagrik -p 4000:4000             -e NODE_ENV=test -e PORTAL_MODE=sandbox -e ENABLE_CRON=false nagrik
          for i in $(seq 1 30); do curl -fsS localhost:4000/health && break; sleep 2; done
          curl -fsS localhost:4000/health
          test "$(docker exec nagrik whoami)" = "pwuser"
          docker logs nagrik | tail -20
      - name: Docker Compose (API + separate filing worker + Redis)
        working-directory: backend
        run: |
          printf 'NODE_ENV=test
PORTAL_MODE=sandbox
ENABLE_CRON=false
' > .env
          docker compose up -d --build
          for i in $(seq 1 40); do curl -fsS localhost:4000/health | grep -q '"redis":"ok"' && break; sleep 3; done
          curl -fsS localhost:4000/health
          curl -fsS localhost:4000/health | grep -q '"redis":"ok"'
          docker compose logs worker | grep -q "worker started"
          docker compose logs api | grep -q "filing worker: off"
          docker compose logs --tail 20
          docker compose down -v

  gemini-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.gemini_eval
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Agent eval (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: npm run eval:intake -- --check
      - name: Help assistant (Gemini classifier and AI fallback)
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run eval:help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-gemini
          path: backend/eval/results/gemini.json
          if-no-files-found: ignore
