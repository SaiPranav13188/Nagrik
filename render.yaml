# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nagrik-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # "free" works for testing and live mode (Wanaparthy's portal needs OTP, so Chromium rarely runs).
    # For heavy sandbox/auto-submit use, upgrade to "standard" (2 GB) — requires a card on Render.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: LOCAL_AUTH_SECRET
        generateValue: true
      - key: PORTAL_MODE
        value: sandbox
      - key: RESEND_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
      - key: ALLOW_LIVE_ESCALATION_EMAILS
        value: "false"
      # The free instance sleeps when idle, so an in-process cron would miss the daily sweep.
      # .github/workflows/monitor.yml triggers POST /jobs/monitor-complaints daily instead
      # (needs the CRON_SECRET repo secret, same value as here).
      - key: ENABLE_CRON
        value: "false"
      # Escalation emails are only sent after the citizen approves them; this caps approvals per user.
      - key: MAX_ESCALATION_EMAILS_PER_DAY
        value: 3
